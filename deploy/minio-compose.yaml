# Shared host MinIO — object storage used by more than one project on this box.
#
# Buckets live in the EXISTING external `minio_data` volume and are shared:
#   • bars-courses        → BarsGroupProject course media (see ../.env S3Config)
#   • regtech-docs / -md  → RegTech pipeline (code-storm-404-bnf-2026/workers,
#                            which reaches MinIO via host.docker.internal:9010)
#
# This replaces the old ORPHAN `docker run` container (also named regtech_minio):
# identical image, ports, creds and volume — but now declaratively managed, so
# it survives reboots and project teardowns instead of staying down forever
# after a stray `docker stop`. That orphan staying stopped is what made
# https://dev.mocki.ru return 502 and broke all BarsGroup media.
#
# Reverse proxy path:  https://dev.mocki.ru  →  host nginx  →  127.0.0.1:9010  → here
# (Ports are published on all interfaces on purpose: RegTech worker containers
#  reach this via host.docker.internal:9010, i.e. the bridge gateway IP, not
#  loopback — a 127.0.0.1-only bind would break them.)
#
# Usage:
#   docker compose -f deploy/minio-compose.yaml up -d
#   docker compose -f deploy/minio-compose.yaml ps
#   Console UI:  http://localhost:9011  (regtech / regtech_secret123)

name: shared-minio

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: regtech_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: regtech
      MINIO_ROOT_PASSWORD: regtech_secret123
    ports:
      - "9010:9000"   # S3 API  → dev.mocki.ru
      - "9011:9001"   # console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: guarantee the bars bucket exists with the same public-read
  # ("download") policy it has today, so a fresh volume would still work.
  # Idempotent — exits 0 after ensuring. RegTech buckets persist in the volume
  # and are left untouched. Reuses the MinIO image (has `mc`) — no extra pull.
  createbuckets:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set h http://minio:9000 regtech regtech_secret123 &&
        mc mb -p h/bars-courses &&
        mc anonymous set download h/bars-courses &&
        echo 'OK: bars-courses ensured (anonymous policy: download)'
    restart: "no"

volumes:
  minio_data:
    external: true   # reuse the data the current MinIO already holds
